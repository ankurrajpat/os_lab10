name: Finalize tested source permissions
on:
  push:
    paths:
      - '.github/workflows/main.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve executable modes and remove temporary workflows
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          z = zipfile.ZipFile('OS_Assignment_10_tested.zip')
          for i in z.infolist():
              if i.is_dir():
                  continue
              parts = pathlib.PurePosixPath(i.filename).parts
              p = pathlib.Path(*parts[1:])
              mode = (i.external_attr >> 16) & 0o777
              if mode:
                  p.chmod(mode)
          PY
          rm -rf .github
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve executable source scripts and remove temporary import workflow'
          git push
